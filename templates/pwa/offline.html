<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2d5c44">
  <title>Sem conexão | Elo Industrial</title>
  <style>
    /* estilos aqui dentro de propósito: esta página precisa funcionar mesmo sem nenhum outro arquivo */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
           background: #e8ebe9; color: #1d2a2f; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
    main { max-width: 26rem; text-align: center; }
    .marca { font-weight: 800; font-size: 1.4rem; margin-bottom: 1.5rem; }
    .marca span { color: #2d5c44; }
    h1 { font-size: 1.5rem; margin: 0 0 .6rem; }
    p { margin: 0 0 1.5rem; line-height: 1.55; }
    button { font: inherit; font-weight: 700; padding: .8rem 1.4rem; border: 2px solid #2d5c44;
             background: #2d5c44; color: #fff; border-radius: 4px; cursor: pointer; min-height: 44px; }
    button:focus-visible { outline: 3px solid #f0b400; outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <div class="marca">Elo<span>Industrial</span></div>
    <h1>Você está sem conexão</h1>
    <p>O Elo Industrial precisa de internet para mostrar anúncios e negociações. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
    <button type="button" onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
